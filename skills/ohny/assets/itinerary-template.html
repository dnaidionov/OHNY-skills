<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My OHNY Plan</title>
<style>
  :root{--bg:#fafaf7;--card:#fff;--ink:#14141a;--muted:#5d6068;--line:#e3e1d8;--accent:#14141a;--onaccent:#fff;--warn:#a4540a;--ok:#1b7a43}
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111114;--card:#1b1b20;--ink:#f1f0ea;--muted:#a2a4ad;--line:#2d2d34;--accent:#f1f0ea;--onaccent:#111114;--warn:#f0a55a;--ok:#5fcf8e}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
  main{max-width:640px;margin:0 auto;padding:20px 16px 56px}
  h1{font-size:1.4rem;margin:0 0 2px}
  .sub{color:var(--muted);margin:0 0 14px;font-size:.92rem}
  .bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:6px 0 18px}
  .bar>i{display:block;height:100%;width:0;background:var(--ok);transition:width .25s}
  .leg{color:var(--muted);font-size:.88rem;margin:10px 0 10px 14px;border-left:2px dashed var(--line);padding-left:12px}
  .stop{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
  .stop.done{opacity:.6}
  .stop.done h2{text-decoration:line-through}
  .row{display:flex;gap:12px;align-items:flex-start}
  .row input[type=checkbox]{width:26px;height:26px;margin-top:2px;accent-color:var(--ok);flex:none}
  .time{font-size:.85rem;color:var(--muted);font-weight:600}
  h2{font-size:1.1rem;margin:0}
  .addr{color:var(--muted);font-size:.92rem;margin:2px 0 6px}
  .note{font-size:.92rem;margin:6px 0}
  .tag{display:inline-block;font-size:.78rem;padding:2px 8px;border-radius:99px;border:1px solid var(--line);margin-right:6px}
  .tag.warn{color:var(--warn);border-color:var(--warn)}
  .acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
  .acts a,.acts button{font:inherit;font-size:.9rem;min-height:44px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--ink);text-decoration:none;display:inline-flex;align-items:center;cursor:pointer}
  .acts .primary{background:var(--accent);color:var(--onaccent);border-color:var(--accent)}
  .foot{margin-top:22px;color:var(--muted);font-size:.8rem}
  #toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--accent);color:var(--onaccent);padding:10px 16px;border-radius:10px;font-size:.9rem;opacity:0;pointer-events:none;transition:opacity .2s}
  #toast.on{opacity:1}
</style>
</head>
<body>
<main>
  <h1 id="title">My OHNY plan</h1>
  <p class="sub" id="sub"></p>
  <div class="bar" aria-hidden="true"><i id="progress"></i></div>
  <div id="stops"></div>
  <p class="foot">Unofficial helper, not affiliated with Open House New York. Times and availability can change; check ohny.org for the latest. <span id="asof"></span></p>
</main>
<div id="toast" role="status"></div>

<!-- Claude: replace ONLY the JSON below. One object per stop, in order. Leave everything else alone. -->
<script type="application/json" id="itinerary">
{
  "title": "Saturday in the Village",
  "subtitle": "Sat Oct 17 · 3 people · walking and subway",
  "as_of": "10:42 AM",
  "stops": [
    {
      "slug": "example-26",
      "time": "10:00 AM",
      "name": "Example Hall",
      "address": "1 Main St, New York",
      "leg": "",
      "tickets": { "needed": false },
      "note": "Free, walk in. Arrive at opening for a short line.",
      "directions_url": "https://www.google.com/maps/dir/?api=1&destination=1+Main+St%2C+New+York&travelmode=transit",
      "kind": "site"
    },
    {
      "slug": "example-tour-26",
      "time": "11:30 AM",
      "name": "Example Tower tour",
      "address": "Address is given with the ticket",
      "leg": "12 min walk",
      "tickets": { "needed": true, "status": "Tickets listed, confirm on the ticket page", "url": "https://example.com/tickets" },
      "note": "Bring photo ID. Arrive 15 minutes early.",
      "directions_url": "https://www.google.com/maps/dir/?api=1&destination=Midtown%2C+New+York&travelmode=transit",
      "kind": "site"
    }
  ]
}
</script>

<script>
(function () {
  var data = JSON.parse(document.getElementById('itinerary').textContent);
  var KEY = 'ohny-plan-done:' + (data.title || '');
  var done = {};
  try { done = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) {}
  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); };
  var safeUrl = function (u) { return /^https?:\/\//i.test(u || '') ? u : ''; };

  $('title').textContent = data.title || 'My OHNY plan';
  $('sub').textContent = data.subtitle || '';
  if (data.as_of) $('asof').textContent = 'Checked at ' + data.as_of + '.';

  function toast(msg) { var t = $('toast'); t.textContent = msg; t.className = 'on'; setTimeout(function () { t.className = ''; }, 2200); }
  function say(text) {
    if (typeof window.sendPrompt === 'function') { window.sendPrompt(text); return; }
    try { navigator.clipboard.writeText(text); toast('Copied. Paste it into the chat.'); } catch (e) { toast('Say: ' + text); }
  }

  function render() {
    var html = '', n = 0, total = (data.stops || []).length;
    (data.stops || []).forEach(function (s, i) {
      var isDone = !!done[s.slug || i]; if (isDone) n++;
      if (i > 0 && s.leg) html += '<div class="leg">' + esc(s.leg) + '</div>';
      else if (i > 0) html += '<div style="height:12px"></div>';
      var t = s.tickets || {};
      html += '<section class="stop' + (isDone ? ' done' : '') + '">' +
        '<div class="row"><input type="checkbox" data-i="' + i + '" aria-label="Mark ' + esc(s.name) + ' as done"' + (isDone ? ' checked' : '') + '>' +
        '<div style="flex:1"><div class="time">' + esc(s.time) + '</div><h2>' + esc(s.name) + '</h2>' +
        '<div class="addr">' + esc(s.address) + '</div>' +
        (t.needed ? '<span class="tag warn">Ticket needed</span>' + (t.status ? '<span class="tag">' + esc(t.status) + '</span>' : '') : '<span class="tag">Free, walk in</span>') +
        (s.note ? '<div class="note">' + esc(s.note) + '</div>' : '') +
        '<div class="acts">' +
        (safeUrl(s.directions_url) ? '<a class="primary" href="' + esc(safeUrl(s.directions_url)) + '" target="_blank" rel="noopener">Directions</a>' : '') +
        (safeUrl(t.url) ? '<a href="' + esc(safeUrl(t.url)) + '" target="_blank" rel="noopener">Tickets</a>' : '') +
        '<button data-ask="' + i + '">Tell me about it</button>' +
        '<button data-checkin="' + i + '">Check in</button>' +
        '<button data-change="' + i + '">Change</button>' +
        '</div></div></div></section>';
    });
    $('stops').innerHTML = html;
    $('progress').style.width = total ? Math.round(100 * n / total) + '%' : '0';
  }

  document.addEventListener('change', function (e) {
    var i = e.target.getAttribute && e.target.getAttribute('data-i'); if (i == null) return;
    var s = data.stops[+i]; done[s.slug || +i] = e.target.checked;
    try { localStorage.setItem(KEY, JSON.stringify(done)); } catch (err) {}
    render();
    if (e.target.checked) say('ohny: I finished stop ' + (+i + 1) + ', ' + s.name + '. What\'s next?');
  });
  document.addEventListener('click', function (e) {
    var b = e.target.closest && e.target.closest('button'); if (!b) return;
    var s;
    if (b.hasAttribute('data-ask')) { s = data.stops[+b.getAttribute('data-ask')]; say('ohny: tell me about ' + s.name); }
    if (b.hasAttribute('data-checkin')) { s = data.stops[+b.getAttribute('data-checkin')]; say('ohny: check me in at ' + s.name); }
    if (b.hasAttribute('data-change')) { s = data.stops[+b.getAttribute('data-change')]; say('ohny: change my plan around ' + s.name); }
  });
  render();
})();
</script>
</body>
</html>
